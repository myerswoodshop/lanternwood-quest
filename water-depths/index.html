<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061c2b">
<title>Lanternwood Quest — Water Depths</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061c2b;color:#fff4cf;font-family:system-ui,sans-serif}body{position:fixed;inset:0}.frame-wrap{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;pointer-events:auto}iframe{border:0;width:100%;height:100%;display:block;background:#061c2b;pointer-events:auto}.ready{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 35%,#0d5368ee,#03131df5 72%)}.ready[hidden]{display:none!important;pointer-events:none!important}.ready-card{width:min(560px,84vw);max-height:88dvh;border:2px solid #78dbef;border-radius:22px;background:linear-gradient(150deg,#0b465bf4,#072638f4);box-shadow:0 20px 70px #000b,0 0 34px #65dff044;padding:14px 18px;text-align:center;display:grid;gap:9px}.wave{font-size:2rem;line-height:1}.chapter{font-size:.65rem;letter-spacing:.2em;font-weight:950;color:#9eefff}.ready h1{font-family:Georgia,serif;font-size:clamp(1.55rem,5vw,2.3rem);line-height:1;margin:0}.ready p{margin:0;color:#dffbff;font-size:.82rem;line-height:1.35}.quick{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.chip{border:1px solid #6bbfd0;border-radius:999px;padding:5px 9px;background:#06293a;font-size:.69rem;font-weight:900}.merchant{border:1px solid #6bbfd0;border-radius:13px;padding:7px 10px;background:#052536}.merchant b{font-size:.74rem;letter-spacing:.07em}.merchant small{display:block;margin-top:2px;color:#dffbff}.actions{display:grid;grid-template-columns:1.25fr 1fr;gap:9px}.actions button{border:0;border-radius:999px;min-height:42px;padding:9px 13px;font-weight:950;letter-spacing:.04em;background:#68dbef;color:#06202a;box-shadow:0 5px #17495b}.actions .back{background:#173f52;color:#eaffff;border:1px solid #6bbfd0;box-shadow:none}@media (orientation:landscape) and (max-height:520px){.ready-card{width:min(600px,72vw);max-height:82dvh;padding:9px 13px;gap:5px;border-radius:17px}.wave{font-size:1.35rem}.chapter{font-size:.52rem}.ready h1{font-size:1.35rem}.ready p{font-size:.66rem}.chip{font-size:.56rem;padding:3px 7px}.merchant{padding:5px 8px}.merchant b{font-size:.61rem}.merchant small{font-size:.57rem}.actions{gap:7px}.actions button{min-height:31px;padding:5px 10px;font-size:.65rem}}
</style>
</head>
<body>
<div class="frame-wrap"><iframe id="waterGame" title="Water Depths game" allow="fullscreen"></iframe></div>
<div class="ready" id="ready">
  <div class="ready-card">
    <div class="wave">🌊</div>
    <div class="chapter">LEVEL 4</div>
    <h1>Water Depths</h1>
    <p>Water Shades have flooded the ruins. Break through them and face the Tidal Warden.</p>
    <div class="quick">
      <span class="chip">Water Shades · 4 HP</span>
      <span class="chip">✦ Light · 1 dmg / 28 stamina</span>
      <span class="chip">➶ Harpoon · 2 dmg / 35 stamina</span>
      <span class="chip">Boss attacks · 3 hearts</span>
    </div>
    <div class="merchant"><b>THIRD NIGHT MERCHANT</b><small>♥ +1 maximum heart · ◆ 10</small></div>
    <div class="actions"><button id="play">ENTER THE WATER</button><button class="back" id="back">← LEVEL MENU</button></div>
  </div>
</div>
<script>
(function(){
'use strict';
var frame=document.getElementById('waterGame'),ready=document.getElementById('ready'),devBoss=new URLSearchParams(location.search).get('devboss')==='1';
function transformGame(html){
  html=html.replace(/🔥 56 stamina/g,'➶ 35 stamina');
  html=html.replace(/Fireball does <b>2 damage<\/b> for <b>56 stamina<\/b>/g,'Harpoon does <b>2 damage</b> for <b>35 stamina</b>');
  html=html.replace(/if\(!running\|\|stamina<56\)return;stamina-=56;/g,'if(!running||stamina<35)return;stamina-=35;');
  html=html.replace(/Fireball: 2 damage · 56 stamina/g,'Harpoon: 2 damage · 35 stamina');
  html=html.replace(/🔥<br>FIREBALL/g,'➶<br>HARPOON');
  html=html.replace(/for\(const s of shots\)\{x\.fillStyle='#ff7627';x\.beginPath\(\);x\.arc\(s\.x,s\.y,11,0,Math\.PI\*2\);x\.fill\(\)\}/g,"for(const s of shots){x.save();x.translate(s.x,s.y);x.rotate(Math.atan2(s.vy,s.vx));x.shadowColor='#b9f7ff';x.shadowBlur=12;x.strokeStyle='#d8fbff';x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(-17,0);x.lineTo(15,0);x.stroke();x.fillStyle='#9cecff';x.beginPath();x.moveTo(18,0);x.lineTo(7,-7);x.lineTo(7,7);x.closePath();x.fill();x.strokeStyle='#69bfd4';x.lineWidth=2;x.beginPath();x.moveTo(-13,-5);x.lineTo(-18,0);x.lineTo(-13,5);x.stroke();x.restore()}");
  if(devBoss){
    html=html.replace('running=false,last=performance.now(),bossOn=false,won=false','running=false,last=performance.now(),bossOn=true,won=false');
    html=html.replace(/let enemies=\[\[220,150\][\s\S]*?\.map\(v=>\(\{x:v\[0\],y:v\[1\],hp:4,stun:0\}\)\);/,'let enemies=[];');
  }
  return html;
}
function addUnderwaterLayer(d){
  if(!d||!d.head)return;
  var old=d.getElementById('lanternwood-underwater-style');if(old)old.remove();
  var s=d.createElement('style');s.id='lanternwood-underwater-style';s.textContent='@keyframes uwCaustic{0%{transform:translate(-4%,-3%) rotate(-1deg) scale(1.08)}50%{transform:translate(4%,2%) rotate(1deg) scale(1.14)}100%{transform:translate(-4%,-3%) rotate(-1deg) scale(1.08)}}@keyframes uwBubble{0%{transform:translateY(30px) translateX(0);opacity:0}15%{opacity:.8}60%{transform:translateY(-250px) translateX(12px);opacity:.6}100%{transform:translateY(-520px) translateX(-8px);opacity:0}}.game{isolation:isolate!important}.underwater-layer{position:absolute;inset:0;z-index:2;pointer-events:none;overflow:hidden;background:linear-gradient(180deg,rgba(44,185,220,.16),rgba(5,78,112,.08) 48%,rgba(0,18,44,.34));box-shadow:inset 0 0 120px rgba(0,13,36,.58)}.underwater-layer:before{content:"";position:absolute;inset:-24%;background:repeating-radial-gradient(ellipse at 50% -10%,rgba(188,249,255,.32) 0 2px,rgba(104,220,240,.13) 5px 11px,transparent 18px 38px);filter:blur(2px);mix-blend-mode:screen;animation:uwCaustic 7s ease-in-out infinite}.underwater-layer:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 0 20%,rgba(159,243,255,.08) 28%,transparent 36% 58%,rgba(159,243,255,.06) 66%,transparent 74%);animation:uwCaustic 10s ease-in-out infinite reverse}.uw-bubble{position:absolute;bottom:-20px;border:2px solid rgba(213,252,255,.68);border-radius:50%;background:rgba(191,247,255,.08);box-shadow:inset -2px -2px 5px rgba(37,157,194,.25);animation:uwBubble var(--d) linear infinite;animation-delay:var(--delay);left:var(--x);width:var(--s);height:var(--s)}.mission,.boss,.mobile{z-index:4!important}';d.head.appendChild(s);
  var game=d.querySelector('.game');if(!game)return;
  var oldLayer=game.querySelector('.underwater-layer');if(oldLayer)oldLayer.remove();
  var layer=d.createElement('div');layer.className='underwater-layer';layer.setAttribute('aria-hidden','true');
  var specs=[['7%','9s','-2s','10px'],['16%','12s','-8s','7px'],['26%','10s','-5s','13px'],['38%','14s','-11s','8px'],['50%','11s','-4s','6px'],['61%','13s','-9s','12px'],['73%','10s','-6s','8px'],['84%','15s','-12s','14px'],['93%','9.5s','-3s','7px']];
  specs.forEach(function(v){var b=d.createElement('i');b.className='uw-bubble';b.style.cssText='--x:'+v[0]+';--d:'+v[1]+';--delay:'+v[2]+';--s:'+v[3];layer.appendChild(b)});game.appendChild(layer);
}
function startInside(){
  var d;try{d=frame.contentDocument||frame.contentWindow.document}catch(e){return}
  var btn=d&&d.getElementById('start'),ov=d&&d.getElementById('overlay');
  if(btn)btn.click();
  if(ov)ov.hidden=true;
  if(devBoss){var bar=d&&d.getElementById('bossbar'),mission=d&&d.getElementById('mission');if(bar)bar.hidden=false;if(mission)mission.textContent='DEV BOSS TEST — TIDAL WARDEN';}
  ready.hidden=true;
  try{frame.contentWindow.focus()}catch(e){}
}
function tuneFrame(){
  var d;try{d=frame.contentDocument||frame.contentWindow.document}catch(e){return}
  if(!d||!d.head)return;
  var old=d.getElementById('lanternwood-water-shell-fix');if(old)old.remove();
  var s=d.createElement('style');s.id='lanternwood-water-shell-fix';s.textContent='html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important}body{min-height:0!important}.wrap{width:100%!important;height:100dvh!important;max-width:none!important;margin:0!important;padding:4px 8px!important;display:flex!important;flex-direction:column!important;overflow:hidden!important}.top{flex:0 0 auto!important;margin:0 0 3px!important;gap:5px!important}.top h1{font-size:clamp(1rem,3vw,1.35rem)!important;margin:0!important;white-space:nowrap}.stats{gap:3px!important;flex-wrap:nowrap!important}.pill{padding:4px 6px!important;font-size:.62rem!important;white-space:nowrap}.game{flex:0 0 auto!important;width:min(100%,calc((100dvh - 54px)*1.77778))!important;margin:0 auto!important}.game canvas{width:100%!important;height:auto!important;aspect-ratio:16/9!important}.overlay[hidden]{display:none!important;pointer-events:none!important}.overlay{padding:6px!important}.panel{max-height:calc(100% - 10px)!important;overflow:hidden!important;padding:11px 14px!important}.mobile{display:block!important;pointer-events:none!important}.joy,.buttons,.buttons button{pointer-events:auto!important}.joy{touch-action:none!important}.buttons button{touch-action:manipulation!important}@media (orientation:landscape) and (max-height:520px){.wrap{padding:2px 7px!important}.top h1{font-size:.95rem!important}.pill{font-size:.54rem!important;padding:3px 5px!important}.game{width:min(100%,calc((100dvh - 40px)*1.77778))!important}.mission{font-size:.55rem!important;padding:4px 7px!important}.joy{width:92px!important;height:92px!important;left:10px!important;bottom:10px!important}.buttons button{width:64px!important;height:64px!important;font-size:.72rem!important}.panel{padding:8px 10px!important}}';d.head.appendChild(s);
  var ov=d.getElementById('overlay');if(ov)ov.hidden=true;
  addUnderwaterLayer(d);
}
function forwardKey(e,type){
  if(!ready.hidden)return;
  var k=e.key.toLowerCase();if(!['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','f'].includes(k))return;
  e.preventDefault();
  try{frame.contentWindow.dispatchEvent(new KeyboardEvent(type,{key:e.key,code:e.code,bubbles:true,cancelable:true,repeat:e.repeat}))}catch(err){}
}
window.addEventListener('keydown',function(e){forwardKey(e,'keydown')},{passive:false});
window.addEventListener('keyup',function(e){forwardKey(e,'keyup')},{passive:false});
frame.addEventListener('load',function(){tuneFrame();if(devBoss)setTimeout(startInside,0)});
fetch('./game.html?v=underwater-harpoon-1',{cache:'no-cache'}).then(function(r){if(!r.ok)throw new Error('Water game load failed');return r.text()}).then(function(html){frame.srcdoc=transformGame(html)}).catch(function(){frame.src='./game.html?v=movement-fix-1'});
document.getElementById('play').addEventListener('click',function(){tuneFrame();startInside()});
document.getElementById('back').addEventListener('click',function(){location.href='../'});
})();
</script>
</body>
</html>
