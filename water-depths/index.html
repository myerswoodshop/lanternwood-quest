<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061c2b">
<title>Lanternwood Quest — Water Depths</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061c2b;color:#fff4cf;font-family:system-ui,sans-serif}body{position:fixed;inset:0}.frame-wrap{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;pointer-events:auto}iframe{border:0;width:100%;height:100%;display:block;background:#061c2b;pointer-events:auto}.ready{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 35%,#0d5368ee,#03131df5 72%)}.ready[hidden]{display:none!important;pointer-events:none!important}.ready-card{width:min(560px,84vw);max-height:88dvh;border:2px solid #78dbef;border-radius:22px;background:linear-gradient(150deg,#0b465bf4,#072638f4);box-shadow:0 20px 70px #000b,0 0 34px #65dff044;padding:14px 18px;text-align:center;display:grid;gap:9px}.wave{font-size:2rem;line-height:1}.chapter{font-size:.65rem;letter-spacing:.2em;font-weight:950;color:#9eefff}.ready h1{font-family:Georgia,serif;font-size:clamp(1.55rem,5vw,2.3rem);line-height:1;margin:0}.ready p{margin:0;color:#dffbff;font-size:.82rem;line-height:1.35}.quick{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.chip{border:1px solid #6bbfd0;border-radius:999px;padding:5px 9px;background:#06293a;font-size:.69rem;font-weight:900}.merchant{border:1px solid #6bbfd0;border-radius:13px;padding:7px 10px;background:#052536}.merchant b{font-size:.74rem;letter-spacing:.07em}.merchant small{display:block;margin-top:2px;color:#dffbff}.actions{display:grid;grid-template-columns:1.25fr 1fr;gap:9px}.actions button{border:0;border-radius:999px;min-height:42px;padding:9px 13px;font-weight:950;letter-spacing:.04em;background:#68dbef;color:#06202a;box-shadow:0 5px #17495b}.actions .back{background:#173f52;color:#eaffff;border:1px solid #6bbfd0;box-shadow:none}@media (orientation:landscape) and (max-height:520px){.ready-card{width:min(600px,72vw);max-height:82dvh;padding:9px 13px;gap:5px;border-radius:17px}.wave{font-size:1.35rem}.chapter{font-size:.52rem}.ready h1{font-size:1.35rem}.ready p{font-size:.66rem}.chip{font-size:.56rem;padding:3px 7px}.merchant{padding:5px 8px}.merchant b{font-size:.61rem}.merchant small{font-size:.57rem}.actions{gap:7px}.actions button{min-height:31px;padding:5px 10px;font-size:.65rem}}
</style>
</head>
<body>
<div class="frame-wrap"><iframe id="waterGame" src="./game.html?v=movement-fix-1" title="Water Depths game" allow="fullscreen"></iframe></div>
<div class="ready" id="ready">
  <div class="ready-card">
    <div class="wave">🌊</div>
    <div class="chapter">LEVEL 4</div>
    <h1>Water Depths</h1>
    <p>Water Shades have flooded the ruins. Break through them and face the Tidal Warden.</p>
    <div class="quick">
      <span class="chip">Water Shades · 4 HP</span>
      <span class="chip">✦ Light · 1 dmg / 28 stamina</span>
      <span class="chip">🔥 Fireball · 2 dmg / 35 stamina</span>
      <span class="chip">Boss attacks · 3 hearts</span>
    </div>
    <div class="merchant"><b>THIRD NIGHT MERCHANT</b><small>♥ +1 maximum heart · ◆ 10</small></div>
    <div class="actions"><button id="play">ENTER THE WATER</button><button class="back" id="back">← LEVEL MENU</button></div>
  </div>
</div>
<script>
(function(){
'use strict';
var frame=document.getElementById('waterGame'),ready=document.getElementById('ready');
function tuneFrame(){
  var d;
  try{d=frame.contentDocument||frame.contentWindow.document}catch(e){return}
  if(!d||!d.head)return;
  var old=d.getElementById('lanternwood-water-shell-fix');if(old)old.remove();
  var s=d.createElement('style');s.id='lanternwood-water-shell-fix';s.textContent='html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important}body{min-height:0!important}.wrap{width:100%!important;height:100dvh!important;max-width:none!important;margin:0!important;padding:4px 8px!important;display:flex!important;flex-direction:column!important;overflow:hidden!important}.top{flex:0 0 auto!important;margin:0 0 3px!important;gap:5px!important}.top h1{font-size:clamp(1rem,3vw,1.35rem)!important;margin:0!important;white-space:nowrap}.stats{gap:3px!important;flex-wrap:nowrap!important}.pill{padding:4px 6px!important;font-size:.62rem!important;white-space:nowrap}.game{flex:0 0 auto!important;width:min(100%,calc((100dvh - 54px)*1.77778))!important;margin:0 auto!important}.game canvas{width:100%!important;height:auto!important;aspect-ratio:16/9!important}.overlay[hidden]{display:none!important;pointer-events:none!important}.overlay{padding:6px!important}.panel{max-height:calc(100% - 10px)!important;overflow:hidden!important;padding:11px 14px!important}.mobile{display:block!important;pointer-events:none!important}.joy,.buttons,.buttons button{pointer-events:auto!important}.joy{touch-action:none!important}.buttons button{touch-action:manipulation!important}@media (orientation:landscape) and (max-height:520px){.wrap{padding:2px 7px!important}.top h1{font-size:.95rem!important}.pill{font-size:.54rem!important;padding:3px 5px!important}.game{width:min(100%,calc((100dvh - 40px)*1.77778))!important}.mission{font-size:.55rem!important;padding:4px 7px!important}.joy{width:92px!important;height:92px!important;left:10px!important;bottom:10px!important}.buttons button{width:64px!important;height:64px!important;font-size:.72rem!important}.panel{padding:8px 10px!important}}';d.head.appendChild(s);
  var ov=d.getElementById('overlay');
  if(ov)ov.hidden=true;
  var panel=ov&&ov.querySelector('.panel');
  var observer=new MutationObserver(function(){
    if(!ov||ov.hidden)return;
    var h=panel&&panel.querySelector('h2');if(!h)return;
    var text=(h.textContent||'').toLowerCase();
    if(text.indexOf('swept away')>=0||text.indexOf('falls')>=0){
      var shop=panel.querySelector('.shop');if(shop)shop.style.display='none';
      var ps=panel.querySelectorAll(':scope > p');for(var i=1;i<ps.length;i++)ps[i].style.display='none';
      panel.style.maxWidth='390px';panel.style.padding='14px';
      var start=d.getElementById('start');if(start&&text.indexOf('swept away')>=0)start.onclick=function(){ready.hidden=false;frame.src='./game.html?v=retry-'+Date.now()};
    }
  });
  if(ov)observer.observe(ov,{attributes:true,attributeFilter:['hidden'],subtree:true,childList:true,characterData:true});
}
frame.addEventListener('load',tuneFrame);
document.getElementById('play').addEventListener('click',function(){
  tuneFrame();
  var d=frame.contentDocument||frame.contentWindow.document,btn=d&&d.getElementById('start'),ov=d&&d.getElementById('overlay');
  if(btn)btn.click();
  if(ov)ov.hidden=true;
  ready.hidden=true;
  requestAnimationFrame(function(){try{frame.contentWindow.focus()}catch(e){};try{var joy=frame.contentDocument&&frame.contentDocument.getElementById('joy');if(joy)joy.focus({preventScroll:true})}catch(e){}});
});
document.getElementById('back').addEventListener('click',function(){location.href='../'});
})();
</script>
</body>
</html>
