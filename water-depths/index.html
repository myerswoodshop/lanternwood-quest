<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061c2b">
<title>Lanternwood Quest — Water Depths</title>
<style>
html,body{margin:0;min-height:100%;background:#061c2b;color:#fff4cf;font-family:system-ui,sans-serif;overflow-x:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:900}
</style>
</head>
<body>
<div id="boot">Loading Water Depths…</div>
<script>
(function(){
'use strict';
fetch('./game.html?v=water-compact-1',{cache:'no-cache'})
.then(function(r){if(!r.ok)throw new Error('Water Depths source missing');return r.text()})
.then(function(html){
  var pairs=[
    ['🔥 56 stamina','🔥 35 stamina'],
    ['for <b>56 stamina</b>','for <b>35 stamina</b>'],
    ['stamina<56','stamina<35'],
    ['stamina-=56','stamina-=35'],
    ['Fireball: 2 damage · 56 stamina','Fireball: 2 damage · 35 stamina']
  ];
  for(var i=0;i<pairs.length;i++) if(html.indexOf(pairs[i][0])!==-1) html=html.replace(pairs[i][0],pairs[i][1]);

  var oldPanel='<div class="panel"><div style="font-size:3rem">🌊</div><h2>The Water Depths</h2><p>Water enemies have <b>4 health</b>. Lantern light does <b>1 damage</b> for <b>28 stamina</b>. Fireball does <b>2 damage</b> for <b>35 stamina</b>.</p><div class="shop"><b>Third Night Merchant</b><p>Permanent +1 maximum heart · 10 rupees</p><button id="buy">BUY HEART · ◆ 10</button></div><p>The Tidal Warden fires water balls, tidal waves, and water walls. Boss water attacks deal <b>3 hearts</b>.</p><p>Regular Water Walls: <b>4 HP</b> = 4 light hits or 2 Fireballs.<br>Reinforced Water Walls: <b>5 HP</b> = 5 light hits or 3 Fireballs.</p><button id="start">ENTER THE WATER</button><button id="back">← LEVEL MENU</button></div>';
  var newPanel='<div class="panel compact-water"><div class="water-head"><span>🌊</span><h2>Water Depths</h2></div><div class="water-grid"><div class="water-card"><b>WATER SHADES</b><p><strong>4 HP</strong><br>✦ Light: 1 dmg · 28 stamina<br>🔥 Fireball: 2 dmg · 35 stamina</p></div><div class="shop water-shop"><b>THIRD NIGHT MERCHANT</b><p>♥ +1 max heart · ◆ 10</p><button id="buy">BUY HEART · ◆ 10</button></div><div class="water-card"><b>TIDAL WARDEN</b><p>Water balls · tidal waves · water walls<br><strong>Boss attacks: 3 hearts</strong></p></div><div class="water-card"><b>WATER WALLS</b><p>Regular: <strong>4 HP</strong> · Reinforced: <strong>5 HP</strong><br>Fireball deals 2 damage</p></div></div><div class="water-actions"><button id="start">ENTER THE WATER</button><button id="back">← LEVEL MENU</button></div></div>';
  if(html.indexOf(oldPanel)!==-1) html=html.replace(oldPanel,newPanel);

  var sizing='<style id="water-main-layout">\n'+
    'html,body{overflow:hidden;}\n'+
    '.wrap{width:100%!important;max-width:none!important;margin:0 auto!important;padding:6px 10px!important;}\n'+
    '.wrap>.top,.wrap>.game{width:min(100%,177.778dvh - 150px)!important;margin-left:auto!important;margin-right:auto!important;}\n'+
    '.game canvas{display:block!important;width:100%!important;height:auto!important;aspect-ratio:16/9!important;}\n'+
    '.overlay{padding:6px!important;}\n'+
    '.panel.compact-water{width:min(720px,96%)!important;max-width:none!important;max-height:calc(100% - 8px)!important;padding:10px 12px!important;border-radius:18px!important;display:flex!important;flex-direction:column!important;gap:7px!important;overflow:hidden!important;}\n'+
    '.water-head{display:flex;align-items:center;justify-content:center;gap:8px;line-height:1!important}.water-head span{font-size:1.45rem}.water-head h2{font-size:1.35rem!important;margin:0!important;}\n'+
    '.water-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;min-height:0}.water-card,.water-shop{margin:0!important;padding:7px 9px!important;border:1px solid #7fcae0;border-radius:12px;background:#052637;text-align:left}.water-card>b,.water-shop>b{display:block;font-size:.68rem;letter-spacing:.08em;color:#baf4ff;margin-bottom:3px}.water-card p,.water-shop p{margin:0!important;font-size:.72rem!important;line-height:1.25!important;color:#fff4cf!important}.water-shop button{display:block;margin:5px 0 0!important;padding:6px 10px!important;font-size:.68rem!important}.water-actions{display:flex;justify-content:center;gap:8px}.water-actions button{margin:0!important;padding:8px 14px!important;font-size:.75rem!important;min-height:34px}\n'+
    '@media(pointer:coarse),(max-width:900px){.wrap{padding:3px 7px!important}.wrap>.top,.wrap>.game{width:min(100%,177.778dvh - 138px)!important}.top{margin-bottom:2px!important;gap:5px!important}.top h1{font-size:1.05rem!important;margin:0!important}.stats{gap:3px!important}.pill{padding:4px 6px!important;font-size:.62rem!important}.panel.compact-water{width:min(680px,97%)!important;padding:7px 9px!important;gap:5px!important}.water-head span{font-size:1.15rem}.water-head h2{font-size:1.08rem!important}.water-grid{gap:5px}.water-card,.water-shop{padding:5px 7px!important}.water-card>b,.water-shop>b{font-size:.58rem}.water-card p,.water-shop p{font-size:.61rem!important;line-height:1.18!important}.water-shop button{padding:5px 8px!important;font-size:.58rem!important}.water-actions button{padding:6px 11px!important;font-size:.64rem!important;min-height:29px}.mission{font-size:.58rem!important;padding:4px 8px!important}}\n'+
    '</style>';
  html=html.replace('</head>',sizing+'</head>');

  /* Hostile Water Shade art; optional so a visual mismatch can never block startup. */
  var enemyOld="for(const e of enemies){x.fillStyle='#176c87';x.shadowColor='#5ee9ff';x.shadowBlur=15;x.beginPath();x.arc(e.x,e.y,23,0,Math.PI*2);x.fill();x.shadowBlur=0;for(let i=0;i<4;i++){x.fillStyle=i<e.hp?'#79efff':'#173747';x.beginPath();x.arc(e.x-15+i*10,e.y-34,4,0,Math.PI*2);x.fill()}}";
  var enemyNew="for(const e of enemies){x.save();x.translate(e.x,e.y);x.shadowColor=e.stun>0?'#c9fbff':'#32d7ef';x.shadowBlur=20;x.fillStyle=e.stun>0?'#3f8293':'#11556c';x.beginPath();x.moveTo(-24,11);x.quadraticCurveTo(-31,-13,-16,-24);x.lineTo(-10,-37);x.lineTo(-1,-27);x.lineTo(8,-40);x.lineTo(16,-25);x.quadraticCurveTo(31,-11,24,13);x.lineTo(13,8);x.lineTo(5,21);x.lineTo(-4,9);x.lineTo(-15,21);x.closePath();x.fill();x.shadowBlur=0;x.fillStyle='#dffcff';x.beginPath();x.moveTo(-16,-11);x.lineTo(-4,-15);x.lineTo(-7,-5);x.closePath();x.moveTo(16,-11);x.lineTo(4,-15);x.lineTo(7,-5);x.closePath();x.fill();x.fillStyle='#001018';x.beginPath();x.arc(-8,-9,2.3,0,Math.PI*2);x.arc(8,-9,2.3,0,Math.PI*2);x.fill();x.strokeStyle='#9cf6ff';x.lineWidth=2.5;x.beginPath();x.moveTo(-12,8);x.lineTo(0,2);x.lineTo(12,8);x.stroke();for(let i=0;i<4;i++){x.fillStyle=i<e.hp?'#79efff':'#173747';x.beginPath();x.arc(-15+i*10,-42,4,0,Math.PI*2);x.fill()}x.restore()}";
  if(html.indexOf(enemyOld)!==-1) html=html.replace(enemyOld,enemyNew);

  document.open();document.write(html);document.close();
})
.catch(function(e){console.error(e);document.getElementById('boot').textContent='Water Depths could not start: '+e.message;});
})();
</script>
</body>
</html>
