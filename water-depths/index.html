<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061c2b">
<title>Lanternwood Quest — Water Depths</title>
<style>
html,body{margin:0;min-height:100%;background:#061c2b;color:#fff4cf;font-family:system-ui,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:900}
</style>
</head>
<body>
<div id="boot">Loading Water Depths…</div>
<script>
(function(){
'use strict';
fetch('./game.html?v=water-fixed-1',{cache:'no-cache'})
.then(function(r){if(!r.ok)throw new Error('Water Depths source missing');return r.text()})
.then(function(html){
  /* Keep the actual Water game intact. Only apply safe balance text/code replacements. */
  var pairs=[
    ['🔥 56 stamina','🔥 35 stamina'],
    ['for <b>56 stamina</b>','for <b>35 stamina</b>'],
    ['stamina<56','stamina<35'],
    ['stamina-=56','stamina-=35'],
    ['Fireball: 2 damage · 56 stamina','Fireball: 2 damage · 35 stamina']
  ];
  for(var i=0;i<pairs.length;i++){
    if(html.indexOf(pairs[i][0])!==-1) html=html.replace(pairs[i][0],pairs[i][1]);
  }

  /* Match the same compact 16:9 presentation used by the other Lanternwood levels. */
  var sizing='<style id="water-main-layout">\n'+
    'html,body{overflow-x:hidden;}\n'+
    '.wrap{width:100%!important;max-width:none!important;margin:0 auto!important;padding:10px 12px 8px!important;}\n'+
    '.wrap>.top,.wrap>.game{width:min(100%,177.778dvh - 163.556px)!important;margin-left:auto!important;margin-right:auto!important;}\n'+
    '.game canvas{display:block!important;width:100%!important;height:auto!important;aspect-ratio:16/9!important;}\n'+
    '@media(pointer:coarse),(max-width:900px){.wrap{padding:4px!important}.wrap>.top,.wrap>.game{width:100%!important}.top{margin-bottom:4px!important}.top h1{font-size:1.2rem!important}.pill{padding:5px 7px!important;font-size:.72rem!important}}\n'+
    '</style>';
  html=html.replace('</head>',sizing+'</head>');

  document.open();
  document.write(html);
  document.close();
})
.catch(function(e){
  console.error(e);
  document.getElementById('boot').textContent='Water Depths could not start: '+e.message;
});
})();
</script>
</body>
</html>
