<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061c2b">
<title>Lanternwood Quest — Water Depths</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061c2b;color:#fff4cf;font-family:system-ui,sans-serif}body{position:fixed;inset:0}.frame-wrap{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden;pointer-events:auto}iframe{border:0;width:100%;height:100%;display:block;background:#061c2b;pointer-events:auto}.water-fx{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:hidden;mix-blend-mode:screen}.water-fx:before{content:"";position:absolute;inset:-18%;background:repeating-radial-gradient(ellipse at 50% -10%,rgba(145,241,255,.16) 0 3px,rgba(40,177,211,.06) 8px 16px,transparent 24px 42px);filter:blur(2px);opacity:.72;animation:caustics 8s linear infinite}.water-fx:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(52,200,228,.12),rgba(7,63,89,.13) 45%,rgba(0,15,31,.3));box-shadow:inset 0 0 90px rgba(0,14,33,.45)}.bubble{position:absolute;bottom:-30px;width:9px;height:9px;border:1px solid rgba(205,250,255,.72);border-radius:50%;background:rgba(153,239,255,.08);box-shadow:inset -2px -2px 4px rgba(65,180,214,.25);animation:bubble-rise var(--dur) linear infinite;animation-delay:var(--delay);left:var(--left);opacity:.7}.bubble:nth-child(2n){width:6px;height:6px;opacity:.5}.bubble:nth-child(3n){width:13px;height:13px;opacity:.35}@keyframes caustics{0%{transform:translate3d(-2%,-1%,0) scale(1.03) rotate(0)}50%{transform:translate3d(3%,2%,0) scale(1.08) rotate(1deg)}100%{transform:translate3d(-2%,-1%,0) scale(1.03) rotate(0)}}@keyframes bubble-rise{0%{transform:translate3d(0,0,0) scale(.65)}40%{transform:translate3d(12px,-42vh,0) scale(1)}75%{transform:translate3d(-8px,-78vh,0) scale(1.08)}100%{transform:translate3d(5px,-115vh,0) scale(.9);opacity:0}}.ready{position:absolute;inset:0;z-index:20;display:grid;place-items:center;padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));background:radial-gradient(circle at 50% 35%,#0d5368ee,#03131df5 72%)}.ready[hidden]{display:none!important;pointer-events:none!important}.ready-card{width:min(560px,84vw);max-height:88dvh;border:2px solid #78dbef;border-radius:22px;background:linear-gradient(150deg,#0b465bf4,#072638f4);box-shadow:0 20px 70px #000b,0 0 34px #65dff044;padding:14px 18px;text-align:center;display:grid;gap:9px}.wave{font-size:2rem;line-height:1}.chapter{font-size:.65rem;letter-spacing:.2em;font-weight:950;color:#9eefff}.ready h1{font-family:Georgia,serif;font-size:clamp(1.55rem,5vw,2.3rem);line-height:1;margin:0}.ready p{margin:0;color:#dffbff;font-size:.82rem;line-height:1.35}.quick{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}.chip{border:1px solid #6bbfd0;border-radius:999px;padding:5px 9px;background:#06293a;font-size:.69rem;font-weight:900}.merchant{border:1px solid #6bbfd0;border-radius:13px;padding:7px 10px;background:#052536}.merchant b{font-size:.74rem;letter-spacing:.07em}.merchant small{display:block;margin-top:2px;color:#dffbff}.actions{display:grid;grid-template-columns:1.25fr 1fr;gap:9px}.actions button{border:0;border-radius:999px;min-height:42px;padding:9px 13px;font-weight:950;letter-spacing:.04em;background:#68dbef;color:#06202a;box-shadow:0 5px #17495b}.actions .back{background:#173f52;color:#eaffff;border:1px solid #6bbfd0;box-shadow:none}@media (orientation:landscape) and (max-height:520px){.ready-card{width:min(600px,72vw);max-height:82dvh;padding:9px 13px;gap:5px;border-radius:17px}.wave{font-size:1.35rem}.chapter{font-size:.52rem}.ready h1{font-size:1.35rem}.ready p{font-size:.66rem}.chip{font-size:.56rem;padding:3px 7px}.merchant{padding:5px 8px}.merchant b{font-size:.61rem}.merchant small{font-size:.57rem}.actions{gap:7px}.actions button{min-height:31px;padding:5px 10px;font-size:.65rem}}
</style>
</head>
<body>
<div class="frame-wrap"><iframe id="waterGame" title="Water Depths game" allow="fullscreen"></iframe><div class="water-fx" aria-hidden="true"><i class="bubble" style="--left:7%;--dur:9s;--delay:-2s"></i><i class="bubble" style="--left:17%;--dur:12s;--delay:-7s"></i><i class="bubble" style="--left:29%;--dur:10s;--delay:-4s"></i><i class="bubble" style="--left:41%;--dur:14s;--delay:-11s"></i><i class="bubble" style="--left:53%;--dur:9.5s;--delay:-5s"></i><i class="bubble" style="--left:64%;--dur:13s;--delay:-8s"></i><i class="bubble" style="--left:76%;--dur:11s;--delay:-3s"></i><i class="bubble" style="--left:88%;--dur:15s;--delay:-10s"></i><i class="bubble" style="--left:95%;--dur:10.5s;--delay:-6s"></i></div></div>
<div class="ready" id="ready">
  <div class="ready-card">
    <div class="wave">🌊</div>
    <div class="chapter">LEVEL 4</div>
    <h1>Water Depths</h1>
    <p>Water Shades have flooded the ruins. Break through them and face the Tidal Warden.</p>
    <div class="quick">
      <span class="chip">Water Shades · 4 HP</span>
      <span class="chip">✦ Light · 1 dmg / 28 stamina</span>
      <span class="chip">🔥 Fireball · 2 dmg / 35 stamina</span>
      <span class="chip">Boss attacks · 3 hearts</span>
    </div>
    <div class="merchant"><b>THIRD NIGHT MERCHANT</b><small>♥ +1 maximum heart · ◆ 10</small></div>
    <div class="actions"><button id="play">ENTER THE WATER</button><button class="back" id="back">← LEVEL MENU</button></div>
  </div>
</div>
<script>
(function(){
'use strict';
var frame=document.getElementById('waterGame'),ready=document.getElementById('ready'),devBoss=new URLSearchParams(location.search).get('devboss')==='1';
function startInside(){
  var d;try{d=frame.contentDocument||frame.contentWindow.document}catch(e){return}
  var btn=d&&d.getElementById('start'),ov=d&&d.getElementById('overlay');
  if(btn)btn.click();
  if(ov)ov.hidden=true;
  if(devBoss){var bar=d&&d.getElementById('bossbar'),mission=d&&d.getElementById('mission');if(bar)bar.hidden=false;if(mission)mission.textContent='DEV BOSS TEST — TIDAL WARDEN';}
  ready.hidden=true;
  requestAnimationFrame(function(){try{frame.contentWindow.focus()}catch(e){};try{var joy=d&&d.getElementById('joy');if(joy)joy.focus({preventScroll:true})}catch(e){}});
}
function tuneFrame(){
  var d;
  try{d=frame.contentDocument||frame.contentWindow.document}catch(e){return}
  if(!d||!d.head)return;
  var old=d.getElementById('lanternwood-water-shell-fix');if(old)old.remove();
  var s=d.createElement('style');s.id='lanternwood-water-shell-fix';s.textContent='html,body{margin:0!important;width:100%!important;height:100%!important;overflow:hidden!important}body{min-height:0!important}.wrap{width:100%!important;height:100dvh!important;max-width:none!important;margin:0!important;padding:4px 8px!important;display:flex!important;flex-direction:column!important;overflow:hidden!important}.top{flex:0 0 auto!important;margin:0 0 3px!important;gap:5px!important}.top h1{font-size:clamp(1rem,3vw,1.35rem)!important;margin:0!important;white-space:nowrap}.stats{gap:3px!important;flex-wrap:nowrap!important}.pill{padding:4px 6px!important;font-size:.62rem!important;white-space:nowrap}.game{flex:0 0 auto!important;width:min(100%,calc((100dvh - 54px)*1.77778))!important;margin:0 auto!important}.game canvas{width:100%!important;height:auto!important;aspect-ratio:16/9!important}.overlay[hidden]{display:none!important;pointer-events:none!important}.overlay{padding:6px!important}.panel{max-height:calc(100% - 10px)!important;overflow:hidden!important;padding:11px 14px!important}.mobile{display:block!important;pointer-events:none!important}.joy,.buttons,.buttons button{pointer-events:auto!important}.joy{touch-action:none!important}.buttons button{touch-action:manipulation!important}@media (orientation:landscape) and (max-height:520px){.wrap{padding:2px 7px!important}.top h1{font-size:.95rem!important}.pill{font-size:.54rem!important;padding:3px 5px!important}.game{width:min(100%,calc((100dvh - 40px)*1.77778))!important}.mission{font-size:.55rem!important;padding:4px 7px!important}.joy{width:92px!important;height:92px!important;left:10px!important;bottom:10px!important}.buttons button{width:64px!important;height:64px!important;font-size:.72rem!important}.panel{padding:8px 10px!important}}';d.head.appendChild(s);
  var ov=d.getElementById('overlay');
  if(ov)ov.hidden=true;
  var panel=ov&&ov.querySelector('.panel');
  var observer=new MutationObserver(function(){
    if(!ov||ov.hidden)return;
    var h=panel&&panel.querySelector('h2');if(!h)return;
    var text=(h.textContent||'').toLowerCase();
    if(text.indexOf('swept away')>=0||text.indexOf('falls')>=0){
      var shop=panel.querySelector('.shop');if(shop)shop.style.display='none';
      var ps=panel.querySelectorAll(':scope > p');for(var i=1;i<ps.length;i++)ps[i].style.display='none';
      panel.style.maxWidth='390px';panel.style.padding='14px';
      var start=d.getElementById('start');if(start&&text.indexOf('swept away')>=0)start.onclick=function(){location.reload()};
    }
  });
  if(ov)observer.observe(ov,{attributes:true,attributeFilter:['hidden'],subtree:true,childList:true,characterData:true});
}
frame.addEventListener('load',function(){tuneFrame();if(devBoss)setTimeout(startInside,0)});
if(devBoss){
  fetch('./game.html?v=dev-boss-1',{cache:'no-cache'}).then(function(r){return r.text()}).then(function(html){
    html=html.replace('running=false,last=performance.now(),bossOn=false,won=false','running=false,last=performance.now(),bossOn=true,won=false');
    html=html.replace(/let enemies=\[\[220,150\][\s\S]*?\.map\(v=>\(\{x:v\[0\],y:v\[1\],hp:4,stun:0\}\)\);/,'let enemies=[];');
    frame.srcdoc=html;
  }).catch(function(){frame.src='./game.html?v=movement-fix-1'});
}else frame.src='./game.html?v=movement-fix-1';
document.getElementById('play').addEventListener('click',function(){tuneFrame();startInside()});
document.getElementById('back').addEventListener('click',function(){location.href='../'});
})();
</script>
</body>
</html>
