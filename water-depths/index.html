<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061c2b">
<title>Lanternlight Quest — Water Depths</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#061c2b;color:#fff4cf;font-family:system-ui,sans-serif}#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:900}</style>
</head>
<body>
<div id="boot">Loading Water Depths…</div>
<script>
(function(){
'use strict';
var devBoss=new URLSearchParams(location.search).get('devboss')==='1';
fetch('./game.html?v=direct-water-2',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Could not load Water Depths ('+r.status+')');return r.text()}).then(function(html){
function swap(from,to,label){if(html.indexOf(from)===-1)throw new Error('Water patch target missing: '+label);html=html.replace(from,to)}

swap('🔥 56 stamina','➶ 35 stamina','harpoon HUD');
swap('Fireball does <b>2 damage</b> for <b>56 stamina</b>.','Harpoon does <b>2 damage</b> for <b>35 stamina</b>.','harpoon intro');
swap('4 light hits or 2 Fireballs.','4 light hits or 2 Harpoons.','regular wall copy');
swap('5 light hits or 3 Fireballs.','5 light hits or 3 Harpoons.','reinforced wall copy');
swap('🔥<br>FIREBALL','➶<br>HARPOON','harpoon button');
swap("function fire(){if(!running||stamina<56)return;stamina-=56;","function fire(){if(!running||stamina<35)return;stamina-=35;",'harpoon stamina');
swap("mission.textContent='Fireball: 2 damage · 56 stamina'","mission.textContent='Harpoon: 2 damage · 35 stamina'",'harpoon mission');

var oldShot="for(const s of shots){x.fillStyle='#ff7627';x.beginPath();x.arc(s.x,s.y,11,0,Math.PI*2);x.fill()}";
var newShot="for(const s of shots){x.save();x.translate(s.x,s.y);x.rotate(Math.atan2(s.vy,s.vx));x.shadowColor='#b9f7ff';x.shadowBlur=14;x.strokeStyle='#e7fdff';x.lineWidth=4;x.lineCap='round';x.beginPath();x.moveTo(-19,0);x.lineTo(14,0);x.stroke();x.fillStyle='#8cecff';x.beginPath();x.moveTo(19,0);x.lineTo(7,-7);x.lineTo(7,7);x.closePath();x.fill();x.strokeStyle='#66b9ce';x.lineWidth=2;x.beginPath();x.moveTo(-14,-6);x.lineTo(-20,0);x.lineTo(-14,6);x.stroke();x.restore()}";
swap(oldShot,newShot,'harpoon projectile');

var oldEnemy="for(const e of enemies){x.fillStyle='#176c87';x.shadowColor='#5ee9ff';x.shadowBlur=15;x.beginPath();x.arc(e.x,e.y,23,0,Math.PI*2);x.fill();x.shadowBlur=0;for(let i=0;i<4;i++){x.fillStyle=i<e.hp?'#79efff':'#173747';x.beginPath();x.arc(e.x-15+i*10,e.y-34,4,0,Math.PI*2);x.fill()}}";
var newEnemy="for(const e of enemies){x.save();x.translate(e.x,e.y);x.shadowColor='#49ddff';x.shadowBlur=18;x.fillStyle=e.stun>0?'#4bafbf':'#07506b';x.beginPath();x.moveTo(0,-28);x.quadraticCurveTo(25,-17,23,8);x.lineTo(14,21);x.lineTo(5,14);x.lineTo(-4,23);x.lineTo(-12,14);x.lineTo(-23,20);x.quadraticCurveTo(-26,-12,0,-28);x.fill();x.fillStyle='#0a3148';x.beginPath();x.moveTo(-21,-7);x.lineTo(-34,-17);x.lineTo(-27,2);x.moveTo(21,-7);x.lineTo(34,-17);x.lineTo(27,2);x.fill();x.shadowBlur=0;x.fillStyle='#dffcff';x.beginPath();x.moveTo(-15,-9);x.lineTo(-3,-6);x.lineTo(-14,-2);x.moveTo(15,-9);x.lineTo(3,-6);x.lineTo(14,-2);x.fill();x.fillStyle='#08202d';x.beginPath();x.arc(-9,-6,2.5,0,Math.PI*2);x.arc(9,-6,2.5,0,Math.PI*2);x.fill();x.strokeStyle='#a8eff7';x.lineWidth=2;x.beginPath();x.moveTo(-9,7);x.lineTo(0,12);x.lineTo(9,7);x.stroke();for(let i=0;i<4;i++){x.fillStyle=i<e.hp?'#79efff':'#173747';x.beginPath();x.arc(-15+i*10,-37,4,0,Math.PI*2);x.fill()}x.restore()}";
swap(oldEnemy,newEnemy,'Water Shade art');

var oldBoss="if(bossOn&&boss.hp>0){x.fillStyle='#053d55';x.shadowColor='#5de8ff';x.shadowBlur=28;x.beginPath();x.arc(boss.x,boss.y,48,0,Math.PI*2);x.fill();x.fillStyle='#8cf3ff';x.beginPath();x.moveTo(boss.x-34,boss.y-30);x.lineTo(boss.x-18,boss.y-65);x.lineTo(boss.x,boss.y-44);x.lineTo(boss.x+20,boss.y-68);x.lineTo(boss.x+36,boss.y-30);x.closePath();x.fill();x.shadowBlur=0}";
var newBoss="if(bossOn&&boss.hp>0){x.save();x.translate(boss.x,boss.y);x.shadowColor='#66edff';x.shadowBlur=34;x.fillStyle=boss.stun>0?'#357f91':'#032f47';x.beginPath();x.moveTo(-48,32);x.quadraticCurveTo(-55,-12,-32,-35);x.lineTo(-43,-53);x.lineTo(-20,-46);x.lineTo(0,-72);x.lineTo(20,-46);x.lineTo(44,-55);x.lineTo(32,-34);x.quadraticCurveTo(55,-10,48,32);x.lineTo(27,19);x.lineTo(15,38);x.lineTo(0,22);x.lineTo(-15,39);x.lineTo(-28,18);x.closePath();x.fill();x.strokeStyle='#76eaff';x.lineWidth=4;x.stroke();x.shadowBlur=0;x.fillStyle='#d9fbff';x.beginPath();x.moveTo(-25,-19);x.lineTo(-5,-13);x.lineTo(-22,-7);x.moveTo(25,-19);x.lineTo(5,-13);x.lineTo(22,-7);x.fill();x.fillStyle='#06161f';x.beginPath();x.arc(-14,-13,4,0,Math.PI*2);x.arc(14,-13,4,0,Math.PI*2);x.fill();x.strokeStyle='#9befff';x.lineWidth=4;x.beginPath();x.moveTo(-20,8);x.quadraticCurveTo(0,23,20,8);x.stroke();x.restore()}";
swap(oldBoss,newBoss,'Tidal Warden art');

var oldPlayer="x.save();x.translate(p.x,p.y);if(p.inv>0&&Math.floor(p.inv*10)%2===0)x.globalAlpha=.45;x.fillStyle='#1e7a7e';x.fillRect(-13,-13,26,31);x.fillStyle='#efb78d';x.beginPath();x.arc(0,-21,11,0,Math.PI*2);x.fill();x.fillStyle='#ffe56f';x.fillRect(17,-2,15,20);x.restore()";
var newPlayer="x.save();x.translate(p.x,p.y);if(p.inv>0&&Math.floor(p.inv*10)%2===0)x.globalAlpha=.55;if(p.inv>0){x.shadowColor='#9a4cff';x.shadowBlur=28;x.strokeStyle='#9c55d9';x.lineWidth=5;x.beginPath();x.arc(0,-4,31,0,Math.PI*2);x.stroke();x.shadowBlur=0}x.fillStyle='#07141b88';x.beginPath();x.ellipse(0,23,20,6,0,0,Math.PI*2);x.fill();x.strokeStyle='#4a3025';x.lineWidth=6;x.lineCap='round';x.beginPath();x.moveTo(-6,10);x.lineTo(-8,22);x.moveTo(6,10);x.lineTo(8,22);x.stroke();x.fillStyle=p.inv>0?'#36204d':'#176f78';x.beginPath();x.moveTo(-13,-10);x.lineTo(12,-10);x.lineTo(11,13);x.quadraticCurveTo(0,19,-11,13);x.closePath();x.fill();x.strokeStyle='#e6ad80';x.lineWidth=5;x.beginPath();x.moveTo(-10,-6);x.lineTo(-18,5);x.moveTo(10,-6);x.lineTo(20,0);x.stroke();x.fillStyle='#efb78d';x.beginPath();x.arc(0,-22,11,0,Math.PI*2);x.fill();x.fillStyle=p.inv>0?'#170e24':'#5c3226';x.beginPath();x.arc(0,-25,12,Math.PI,Math.PI*2);x.fill();x.fillStyle=p.inv>0?'#e8d4ff':'#fff7e7';x.beginPath();x.arc(-4,-21,2,0,Math.PI*2);x.arc(4,-21,2,0,Math.PI*2);x.fill();x.fillStyle='#16282a';x.beginPath();x.arc(-4,-21,1,0,Math.PI*2);x.arc(4,-21,1,0,Math.PI*2);x.fill();x.shadowColor='#ffe56f';x.shadowBlur=18;x.fillStyle='#ffe56f';x.fillRect(17,-4,13,18);x.strokeStyle='#b97827';x.lineWidth=2;x.strokeRect(17,-4,13,18);x.shadowBlur=0;x.restore()";
swap(oldPlayer,newPlayer,'explorer art');

var arenaAnchor="x.strokeStyle='#5bc7df';x.lineWidth=5;x.strokeRect(26,72,W-52,H-94);";
var underwater="x.strokeStyle='#5bc7df';x.lineWidth=5;x.strokeRect(26,72,W-52,H-94);let uw=performance.now()/1000;x.save();x.globalCompositeOperation='screen';for(let i=0;i<7;i++){let yy=105+i*58+Math.sin(uw*1.25+i)*13;x.strokeStyle='rgba(126,232,255,'+(0.075+i%2*.035)+')';x.lineWidth=13+i%3*4;x.beginPath();x.moveTo(35,yy);for(let xx=35;xx<W-25;xx+=45)x.lineTo(xx,yy+Math.sin(xx*.022+uw*1.8+i)*11);x.stroke()}for(let i=0;i<24;i++){let bx=45+(i*137)%870,by=495-((uw*(22+i%5*7)+i*83)%410),br=2+i%4;x.strokeStyle='rgba(203,249,255,'+(0.22+i%3*.08)+')';x.lineWidth=1.5;x.beginPath();x.arc(bx+Math.sin(uw+i)*10,by,br,0,Math.PI*2);x.stroke()}let rays=x.createLinearGradient(0,75,0,500);rays.addColorStop(0,'rgba(150,242,255,.18)');rays.addColorStop(.45,'rgba(48,175,211,.06)');rays.addColorStop(1,'rgba(0,22,55,.12)');x.fillStyle=rays;x.fillRect(26,72,W-52,H-94);x.restore();";
swap(arenaAnchor,underwater,'underwater canvas effects');

swap("addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys.add(k);if(k===' '&&!e.repeat)light();if(k==='f'&&!e.repeat)fire()});","addEventListener('keydown',e=>{let k=e.key.toLowerCase();if(['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','f'].includes(k))e.preventDefault();keys.add(k);if(k===' '&&!e.repeat)light();if(k==='f'&&!e.repeat)fire()});",'native WASD');

swap("<div class=\"stats\"><span class=\"pill\" id=\"hp\"></span><span class=\"pill\" id=\"rup\"></span><span class=\"pill\">✦ 28 stamina</span><span class=\"pill\">➶ 35 stamina</span></div>","<div class=\"stats water-hud\"><span class=\"pill\" id=\"hp\"></span><span class=\"pill\" id=\"rup\"></span><span class=\"pill\" id=\"shade\">🌊 6</span><span class=\"pill\">✦ 28</span><span class=\"pill\">➶ 35</span><span class=\"water-energy\" aria-label=\"100 percent energy\"><em>ENERGY</em><u><i id=\"ef\" style=\"width:100%\"></i></u></span></div>",'Water HUD markup');
swap("document.getElementById('hp').textContent='♥'.repeat(Math.max(0,hp))+'♡'.repeat(Math.max(0,maxHp-hp))+' · '+Math.round(stamina)+'%';document.getElementById('rup').textContent='◆ '+rupees;bf.style.width=Math.max(0,boss.hp/boss.max*100)+'%';","document.getElementById('hp').textContent='♥'.repeat(Math.max(0,hp))+'♡'.repeat(Math.max(0,maxHp-hp));document.getElementById('rup').textContent='◆ '+rupees;document.getElementById('shade').textContent='🌊 '+enemies.length;document.getElementById('ef').style.width=Math.max(0,stamina)+'%';document.querySelector('.water-energy').setAttribute('aria-label',Math.round(stamina)+' percent energy');bf.style.width=Math.max(0,boss.hp/boss.max*100)+'%';",'Water HUD updates');

swap("for(const w of waves){w.y+=w.vy*dt;w.life-=dt;if(!w.hit&&Math.abs(p.y-w.y)<w.h*.6){w.hit=true;hurt(3,'TIDAL WAVE! 3 hearts lost!')}}","for(const w of waves){w.y+=w.vy*dt;w.life-=dt;if(!w.hit&&Math.abs(p.y-w.y)<w.h*.34){w.hit=true;hurt(1,'TIDAL WAVE! 1 heart lost!')}}",'tidal wave collision');
var oldWaveDraw="for(const w of waves){x.fillStyle='#65e8ff88';x.fillRect(28,w.y-w.h,W-56,w.h*2)}";
var newWaveDraw="for(const w of waves){x.save();let yy=w.y;x.fillStyle='rgba(54,193,226,.18)';x.beginPath();x.moveTo(28,yy+18);for(let xx=28;xx<=W-28;xx+=32)x.lineTo(xx,yy+Math.sin(xx*.055+yy*.03)*10);x.lineTo(W-28,yy+34);x.lineTo(28,yy+34);x.closePath();x.fill();x.strokeStyle='rgba(214,251,255,.92)';x.lineWidth=5;x.shadowColor='#5de8ff';x.shadowBlur=12;x.beginPath();x.moveTo(28,yy);for(let xx=28;xx<=W-28;xx+=28)x.lineTo(xx,yy+Math.sin(xx*.06+yy*.025)*8);x.stroke();x.restore()}";
swap(oldWaveDraw,newWaveDraw,'tidal wave art');

var oldOverlay='<div class="overlay" id="overlay"><div class="panel"><div style="font-size:3rem">🌊</div><h2>The Water Depths</h2><p>Water enemies have <b>4 health</b>. Lantern light does <b>1 damage</b> for <b>28 stamina</b>. Harpoon does <b>2 damage</b> for <b>35 stamina</b>.</p><div class="shop"><b>Third Night Merchant</b><p>Permanent +1 maximum heart · 10 rupees</p><button id="buy">BUY HEART · ◆ 10</button></div><p>The Tidal Warden fires water balls, tidal waves, and water walls. Boss water attacks deal <b>3 hearts</b>.</p><p>Regular Water Walls: <b>4 HP</b> = 4 light hits or 2 Harpoons.<br>Reinforced Water Walls: <b>5 HP</b> = 5 light hits or 3 Harpoons.</p><button id="start">ENTER THE WATER</button><button id="back">← LEVEL MENU</button></div></div>';
var newOverlay='<div class="overlay" id="overlay"><div class="panel"><div style="font-size:2rem">🌊</div><h2>The Water Depths</h2><p>Defeat the Water Shades, then face the Tidal Warden.</p><div class="shop"><b>Third Night Merchant</b><p>♥ +1 maximum heart · ◆ 10</p><button id="buy">BUY HEART · ◆ 10</button></div><div class="water-quick">4 HP Shades · ✦ 1 dmg / 28 · ➶ 2 dmg / 35 · Water balls/walls hit hard · Tidal wave costs 1 heart</div><button id="start">ENTER THE WATER</button><button id="back">← LEVEL MENU</button></div></div>';
swap(oldOverlay,newOverlay,'compact intro');

var css='<style id="water-direct-fix">html,body{width:100%;height:100%;overflow:hidden}.wrap{width:100%;height:100dvh;max-width:none;margin:0;padding:4px 8px;display:flex;flex-direction:column;overflow:hidden}.top{flex:0 0 auto;margin:0 0 3px;gap:5px}.top h1{font-size:clamp(1rem,3vw,1.35rem);margin:0;white-space:nowrap}.top>.stats{display:none!important}.game{flex:0 0 auto;width:min(100%,calc((100dvh - 54px)*1.77778));margin:0 auto}.game canvas{width:100%;height:auto;aspect-ratio:16/9}.water-hud{position:absolute!important;z-index:4;top:8px;left:8px;right:8px;display:flex!important;gap:5px!important;align-items:center!important;justify-content:flex-start!important;flex-wrap:nowrap!important;pointer-events:none}.water-hud .pill{background:#03131ddd;border:1px solid #7edcf0;border-radius:999px;padding:6px 9px;font-size:.7rem;font-weight:950;white-space:nowrap;box-shadow:0 5px 18px #0008}.water-energy{background:#03131ddd;border:1px solid #7edcf0;border-radius:11px;width:105px;padding:5px 8px;box-shadow:0 5px 18px #0008}.water-energy em{display:block;color:#bfefff;font-size:.48rem;font-style:normal;font-weight:950;letter-spacing:.12em;margin-bottom:3px}.water-energy u{display:block;height:6px;background:#163a48;border-radius:99px;overflow:hidden}.water-energy u i{display:block;height:100%;background:linear-gradient(90deg,#49dfff,#fff17a);border-radius:inherit;transition:width .1s linear}.mission{top:52px!important}.boss{top:84px!important}.overlay[hidden]{display:none!important}.overlay{padding:6px}.panel{max-width:520px;max-height:calc(100% - 10px);overflow:hidden;padding:10px 14px}.panel h2{font-size:1.55rem;margin:2px}.panel p{font-size:.72rem;margin:5px}.shop{margin:6px 0;padding:7px}.water-quick{font-size:.66rem;font-weight:900;margin:5px 0;color:#bfefff}.mobile{display:block;pointer-events:none}.joy,.buttons,.buttons button{pointer-events:auto}.joy{touch-action:none}.buttons button{touch-action:manipulation}@media(orientation:landscape) and (max-height:520px){.wrap{padding:2px 7px}.top h1{font-size:.95rem}.game{width:min(100%,calc((100dvh - 40px)*1.77778))}.water-hud{top:5px;left:6px;right:6px;gap:3px!important}.water-hud .pill{font-size:.54rem;padding:4px 5px}.water-energy{width:78px;padding:3px 5px}.water-energy em{display:none}.mission{top:38px!important;font-size:.55rem;padding:4px 7px}.boss{top:65px!important}.joy{width:92px;height:92px;left:10px;bottom:10px}.buttons button{width:64px;height:64px;font-size:.72rem}.panel{max-width:480px;padding:7px 10px}.panel h2{font-size:1.15rem}.panel p,.water-quick{font-size:.58rem}.shop{padding:4px;margin:4px 0}.panel button{padding:6px 10px}}</style>';
html=html.replace('</head>',css+'</head>');

if(devBoss){
  swap('running=false,last=performance.now(),bossOn=false,won=false','running=false,last=performance.now(),bossOn=true,won=false','DEV boss active');
  html=html.replace(/let enemies=\[\[220,150\][\s\S]*?\.map\(v=>\(\{x:v\[0\],y:v\[1\],hp:4,stun:0\}\)\);/,'let enemies=[];');
  html=html.replace('</body>',"<script>setTimeout(function(){var b=document.getElementById('bossbar');if(b)b.hidden=false;var s=document.getElementById('start');if(s)s.click()},0)<\/script></body>");
}

html=html.replace('</body>','<script>(function(){var g=document.querySelector(".game"),s=document.querySelector(".water-hud");if(g&&s)g.insertBefore(s,g.firstChild)})();<\/script><script src="../portal-theme.js?v=3"><\/script></body>');
document.open();document.write(html);document.close();
}).catch(function(err){console.error(err);document.getElementById('boot').textContent='Water Depths could not start: '+(err&&err.message?err.message:err)});
})();
</script>
</body>
</html>
