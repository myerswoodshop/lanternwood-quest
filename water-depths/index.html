<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#061c2b">
<title>Lanternwood Quest — Water Depths</title>
<style>
html,body{margin:0;min-height:100%;background:#061c2b;color:#fff4cf;font-family:system-ui,sans-serif;overflow-x:hidden}#boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:900}
</style>
</head>
<body>
<div id="boot">Loading Water Depths…</div>
<script>
(function(){
'use strict';
fetch('./game.html?v=water-fixed-2',{cache:'no-cache'})
.then(function(r){if(!r.ok)throw new Error('Water Depths source missing');return r.text()})
.then(function(html){
  var pairs=[
    ['🔥 56 stamina','🔥 35 stamina'],
    ['for <b>56 stamina</b>','for <b>35 stamina</b>'],
    ['stamina<56','stamina<35'],
    ['stamina-=56','stamina-=35'],
    ['Fireball: 2 damage · 56 stamina','Fireball: 2 damage · 35 stamina']
  ];
  for(var i=0;i<pairs.length;i++) if(html.indexOf(pairs[i][0])!==-1) html=html.replace(pairs[i][0],pairs[i][1]);

  /* Same height-limited 16:9 sizing as the main Lanternwood levels. Never force full width in landscape. */
  var sizing='<style id="water-main-layout">\n'+
    'html,body{overflow-x:hidden;}\n'+
    '.wrap{width:100%!important;max-width:none!important;margin:0 auto!important;padding:10px 12px 8px!important;}\n'+
    '.wrap>.top,.wrap>.game{width:min(100%,177.778dvh - 163.556px)!important;margin-left:auto!important;margin-right:auto!important;}\n'+
    '.game canvas{display:block!important;width:100%!important;height:auto!important;aspect-ratio:16/9!important;}\n'+
    '@media(pointer:coarse),(max-width:900px){.wrap{padding:4px 8px 6px!important}.top{margin-bottom:4px!important}.top h1{font-size:1.2rem!important}.pill{padding:5px 7px!important;font-size:.72rem!important}}\n'+
    '</style>';
  html=html.replace('</head>',sizing+'</head>');

  /* Make Water Shades look hostile instead of smiling. These replacements are optional and never block level startup. */
  var enemyOld="for(const e of enemies){x.fillStyle='#176c87';x.shadowColor='#5ee9ff';x.shadowBlur=15;x.beginPath();x.arc(e.x,e.y,23,0,Math.PI*2);x.fill();x.shadowBlur=0;for(let i=0;i<4;i++){x.fillStyle=i<e.hp?'#79efff':'#173747';x.beginPath();x.arc(e.x-15+i*10,e.y-34,4,0,Math.PI*2);x.fill()}}";
  var enemyNew="for(const e of enemies){x.save();x.translate(e.x,e.y);x.shadowColor=e.stun>0?'#c9fbff':'#32d7ef';x.shadowBlur=22;x.fillStyle=e.stun>0?'#3f8293':'#11556c';x.beginPath();x.moveTo(-25,10);x.quadraticCurveTo(-30,-12,-16,-23);x.lineTo(-10,-35);x.lineTo(-1,-26);x.lineTo(8,-38);x.lineTo(15,-24);x.quadraticCurveTo(31,-10,24,12);x.lineTo(13,8);x.lineTo(5,20);x.lineTo(-4,9);x.lineTo(-14,20);x.closePath();x.fill();x.shadowBlur=0;x.fillStyle='#dffcff';x.beginPath();x.moveTo(-15,-9);x.lineTo(-4,-13);x.lineTo(-6,-4);x.closePath();x.moveTo(15,-9);x.lineTo(4,-13);x.lineTo(6,-4);x.closePath();x.fill();x.fillStyle='#02151d';x.beginPath();x.arc(-7,-8,2.2,0,Math.PI*2);x.arc(7,-8,2.2,0,Math.PI*2);x.fill();x.strokeStyle='#9cf6ff';x.lineWidth=2.5;x.beginPath();x.moveTo(-12,7);x.lineTo(0,2);x.lineTo(12,7);x.stroke();x.strokeStyle='#47dff3';x.lineWidth=3;x.beginPath();x.moveTo(-19,2);x.lineTo(-31,12);x.moveTo(19,2);x.lineTo(31,12);x.stroke();for(let i=0;i<4;i++){x.fillStyle=i<e.hp?'#79efff':'#173747';x.beginPath();x.arc(-15+i*10,-40,4,0,Math.PI*2);x.fill()}x.restore()}";
  if(html.indexOf(enemyOld)!==-1) html=html.replace(enemyOld,enemyNew);

  var bossOld="if(bossOn&&boss.hp>0){x.fillStyle='#053d55';x.shadowColor='#5de8ff';x.shadowBlur=28;x.beginPath();x.arc(boss.x,boss.y,48,0,Math.PI*2);x.fill();x.fillStyle='#8cf3ff';x.beginPath();x.moveTo(boss.x-34,boss.y-30);x.lineTo(boss.x-18,boss.y-65);x.lineTo(boss.x,boss.y-44);x.lineTo(boss.x+20,boss.y-68);x.lineTo(boss.x+36,boss.y-30);x.closePath();x.fill();x.shadowBlur=0}";
  var bossNew="if(bossOn&&boss.hp>0){x.save();x.translate(boss.x,boss.y);x.shadowColor='#42e4ff';x.shadowBlur=38;x.fillStyle='#043346';x.beginPath();x.moveTo(-48,34);x.quadraticCurveTo(-55,-18,-30,-37);x.lineTo(-22,-66);x.lineTo(-8,-48);x.lineTo(0,-78);x.lineTo(12,-49);x.lineTo(29,-69);x.lineTo(30,-39);x.quadraticCurveTo(55,-18,48,35);x.lineTo(28,22);x.lineTo(15,43);x.lineTo(0,26);x.lineTo(-15,44);x.lineTo(-29,23);x.closePath();x.fill();x.fillStyle='#83efff';x.beginPath();x.moveTo(-34,-31);x.lineTo(-20,-67);x.lineTo(0,-48);x.lineTo(21,-70);x.lineTo(36,-31);x.closePath();x.fill();x.shadowBlur=0;x.fillStyle='#e9fdff';x.beginPath();x.moveTo(-25,-13);x.lineTo(-7,-18);x.lineTo(-11,-5);x.closePath();x.moveTo(25,-13);x.lineTo(7,-18);x.lineTo(11,-5);x.closePath();x.fill();x.fillStyle='#00151e';x.beginPath();x.arc(-13,-11,3,0,Math.PI*2);x.arc(13,-11,3,0,Math.PI*2);x.fill();x.strokeStyle='#72eaff';x.lineWidth=4;x.beginPath();x.moveTo(-20,16);x.quadraticCurveTo(0,2,20,16);x.stroke();x.restore()}";
  if(html.indexOf(bossOld)!==-1) html=html.replace(bossOld,bossNew);

  document.open();document.write(html);document.close();
})
.catch(function(e){console.error(e);document.getElementById('boot').textContent='Water Depths could not start: '+e.message;});
})();
</script>
</body>
</html>
