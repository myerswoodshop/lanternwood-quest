name: Recover original Lanternwood Quest

on:
  push:
    paths:
      - '.github/workflows/recover-original.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repair corrupted recovery chunk and reconstruct game
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          names = ['c00.txt','p01.txt','p02.txt','p03.txt','p04.txt','p05.txt','p06.txt']
          parts = [Path('.recovery', n).read_text().strip() for n in names]
          expected_b64_len = 110272
          extra = sum(map(len, parts)) - expected_b64_len
          target = '179d57ed9a50cf765fd4bce193867a33932ae95f880c740d08860647d29ab136'
          assert extra == 3863, (sum(map(len, parts)), extra)

          bad = parts[3]
          prefix = ''.join(parts[:3])
          suffix = ''.join(parts[4:])
          found = None
          for i in range(len(bad) - extra + 1):
              candidate_bad = bad[:i] + bad[i+extra:]
              payload = prefix + candidate_bad + suffix
              if len(payload) != expected_b64_len:
                  continue
              try:
                  raw = base64.b64decode(payload, validate=True)
                  html = gzip.decompress(raw)
              except Exception:
                  continue
              if len(html) == 272613 and hashlib.sha256(html).hexdigest() == target:
                  found = (i, candidate_bad, html)
                  break

          if found is None:
              raise SystemExit('Could not locate the accidental 3863-character insertion in p03.txt')

          i, repaired, html = found
          print(f'Found accidental insertion at p03 offset {i}; repairing payload.')
          Path('.recovery/p03.txt').write_text(repaired)
          Path('index.html').write_bytes(html)
          print('Recovered game verified:', len(html), hashlib.sha256(html).hexdigest())
          PY

      - name: Verify recovered game
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < index.html)" -eq 272613
          echo '179d57ed9a50cf765fd4bce193867a33932ae95f880c740d08860647d29ab136  index.html' | sha256sum -c -
          grep -q 'The Lanternwood Quest' index.html

      - name: Commit recovered game and repaired payload
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .recovery/p03.txt
          if git diff --cached --quiet; then
            echo 'Recovery is already current.'
            exit 0
          fi
          git commit -m 'Restore recovered Lanternwood Quest game'
          git push
