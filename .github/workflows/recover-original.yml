name: Recover original Lanternwood Quest

on:
  push:
    paths:
      - '.github/workflows/recover-original.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct recovered standalone game
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .recovery/c00.txt \
            .recovery/p01.txt \
            .recovery/p02.txt \
            .recovery/p03.txt \
            .recovery/p04.txt \
            .recovery/p05.txt \
            .recovery/p06.txt \
            > /tmp/lanternwood.b64
          base64 --decode /tmp/lanternwood.b64 > /tmp/lanternwood.html.gz
          gzip -dc /tmp/lanternwood.html.gz > index.html

      - name: Verify recovered game
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < index.html)" -eq 272613
          echo '179d57ed9a50cf765fd4bce193867a33932ae95f880c740d08860647d29ab136  index.html' | sha256sum -c -
          grep -q 'The Lanternwood Quest' index.html
          echo 'Recovered game verified.'

      - name: Commit recovered game
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'index.html is already current.'
            exit 0
          fi
          git commit -m 'Restore recovered Lanternwood Quest game'
          git push
