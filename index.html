<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#091a16">
  <title>The Lanternwood Quest</title>
  <style>
    html,body{margin:0;min-height:100%;background:#091a16;color:#fff4cf;font-family:system-ui,sans-serif}
    #boot{position:fixed;inset:0;display:grid;place-items:center;font-weight:800}
  </style>
</head>
<body>
  <div id="boot">Loading Lanternwood…</div>
  <script>
  (function(){
    'use strict';
    fetch('./game.html?v=brightness-100', {cache:'no-cache'})
      .then(function(r){ if(!r.ok) throw new Error('Could not load game ('+r.status+')'); return r.text(); })
      .then(function(html){
        var saved='Math.max(60,Math.min(140,e.brightness))';
        var savedFixed='Math.max(60,Math.min(100,e.brightness))';
        var slider='min:`60`,max:`140`,step:`5`,value:B';
        var sliderFixed='min:`60`,max:`100`,step:`5`,value:B';
        if(html.indexOf(saved)===-1 || html.indexOf(slider)===-1 || html.indexOf('__ReactDOMClient.hydrateRoot')===-1){
          throw new Error('Lanternwood source verification failed');
        }
        html=html.replace(saved,savedFixed).replace(slider,sliderFixed);
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(err){
        console.error('Lanternwood loader failed',err);
        document.getElementById('boot').textContent='Lanternwood could not start: '+(err&&err.message?err.message:err);
      });
  })();
  </script>
</body>
</html>
