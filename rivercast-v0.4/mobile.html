<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Trout Magnet RiverCast</title>
  <style>
    html,body{margin:0;min-height:100%;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .brand-loader{min-height:100svh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#0c0d0f 0%,#202328 55%,#9dbf26 160%);color:#fff;text-align:center}
    .loader-card{width:min(100%,390px);padding:26px 22px;border:2px solid #e51b23;border-radius:26px;background:repeating-linear-gradient(135deg,#0b0c0e 0 9px,#111317 9px 18px);box-shadow:0 25px 60px #0008}
    .loader-logo{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:42px;font-style:italic;line-height:.86;letter-spacing:-1.5px;text-transform:uppercase;text-shadow:-3px 3px 0 #000,0 0 0 2px #fff}
    .loader-logo span{color:#fff}.loader-logo b{color:#e51b23;-webkit-text-stroke:1px #fff}
    .loader-sub{margin-top:10px;color:#d8ef38;font-weight:1000;letter-spacing:.25em}
    .loader-copy{margin:18px 0 0;color:#e8edf0;font-size:13px}
    .loader-dot{display:inline-block;width:9px;height:9px;margin:18px 3px 0;border-radius:50%;background:#d8ef38;animation:pulse 1s infinite alternate}.loader-dot:nth-child(2){animation-delay:.18s}.loader-dot:nth-child(3){animation-delay:.36s}
    @keyframes pulse{to{opacity:.2;transform:translateY(-4px)}}
    .fallback{display:none;margin-top:16px;color:#fff}
    .fallback a{display:inline-block;margin-top:8px;padding:11px 16px;border-radius:999px;background:#e51b23;color:#fff;font-weight:900;text-decoration:none}
  </style>
</head>
<body>
  <div class="brand-loader" id="brand-loader">
    <div class="loader-card">
      <svg width="92" height="58" viewBox="0 0 184 116" aria-hidden="true" style="margin:0 auto 5px;display:block;filter:drop-shadow(0 7px 5px #0008)">
        <path d="M15 67C40 27 88 14 135 34c16 7 29 18 38 30-11 12-25 24-43 31C83 113 39 97 15 67Z" fill="#b8d431" stroke="#0b0b0b" stroke-width="6"/>
        <path d="M15 67 1 38c19 4 32 13 41 27-10 16-23 27-41 31Z" fill="#189645" stroke="#0b0b0b" stroke-width="6"/>
        <path d="M84 35 100 8c13 7 23 17 29 30Z" fill="#d9ed3a" stroke="#0b0b0b" stroke-width="6"/>
        <circle cx="143" cy="50" r="6" fill="#0b0b0b"/>
        <path d="M145 69c8 4 15 4 23-1" fill="none" stroke="#0b0b0b" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div class="loader-logo"><span>Trout</span> <b>Magnet</b></div>
      <div class="loader-sub">RIVERCAST</div>
      <p class="loader-copy">Loading the Little Red River companion…</p>
      <span class="loader-dot"></span><span class="loader-dot"></span><span class="loader-dot"></span>
      <div class="fallback" id="fallback">The branded preview could not load.<br><a href="../rivercast-v0.3/mobile.html">Open basic preview</a></div>
    </div>
  </div>
<script>
(async function(){
  const BRAND_CSS = String.raw`
:root{--ink:#111216!important;--blue:#0ba8d1!important;--deep:#c3151b!important;--sun:#d8ef38!important;--coral:#e51b23!important;--green:#89a91e!important;--paper:#fff!important;--line:#e5e7e9!important}
body{background:linear-gradient(145deg,#101114 0%,#2a2d31 28%,#d8ef38 145%)!important}
.app{background:#f8faf9!important;box-shadow:0 0 55px #0008!important}
.top.tm-top{min-height:92px;padding:calc(9px + env(safe-area-inset-top,0px)) 12px 8px!important;background:repeating-linear-gradient(135deg,#090a0c 0 10px,#121419 10px 20px)!important;border-bottom:5px solid #e51b23!important;box-shadow:0 6px 18px #0005!important}
.tm-lockup{display:flex;align-items:center;gap:8px;min-width:0}.tm-fishmark{width:58px;height:46px;flex:0 0 auto;filter:drop-shadow(0 4px 3px #0009)}
.tm-words{line-height:.8;transform:skew(-8deg)}.tm-name{font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:25px;font-style:italic;text-transform:uppercase;letter-spacing:-.5px;white-space:nowrap;text-shadow:-2px 2px 0 #000,1px 0 0 #fff,0 1px 0 #fff,-1px 0 0 #fff,0 -1px 0 #fff}.tm-name .trout{color:#fff}.tm-name .magnet{color:#e51b23;margin-left:3px}.tm-appname{margin-top:5px;color:#d8ef38;font-size:11px;font-weight:1000;letter-spacing:.22em;transform:skew(8deg)}
.demo{background:#d8ef38!important;color:#111!important;border:2px solid #fff!important;box-shadow:0 3px 0 #6f7f16!important;font-size:8px!important;padding:7px 8px!important}
.main{background:linear-gradient(#f7faf8,#fffde8 80%)!important}.eyebrow{color:#c3151b!important}.screen>h1{color:#111!important}
.tm-brand-hero{position:relative;overflow:hidden;margin:11px 0 13px;padding:16px 128px 16px 16px;border:3px solid #111;border-radius:22px;background:linear-gradient(135deg,#d8ef38 0%,#f5f56f 58%,#8fb92d 100%);box-shadow:0 10px 0 #111,0 18px 28px #1112}
.tm-brand-hero:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(155deg,transparent 0 18px,#ffffff33 18px 20px);pointer-events:none}.tm-brand-hero>*{position:relative;z-index:2}.tm-brand-hero small{display:block;color:#111;font-size:8px;font-weight:1000;letter-spacing:.14em}.tm-brand-hero strong{display:block;margin:4px 0 8px;font-family:Impact,Haettenschweiler,"Arial Narrow Bold",sans-serif;font-size:24px;line-height:.98;text-transform:uppercase;font-style:italic}.tm-brand-hero p{margin:0;color:#273012;font-size:10px;font-weight:800}.tm-jig{position:absolute;z-index:1;right:4px;bottom:-9px;width:132px;height:105px;filter:drop-shadow(0 8px 7px #0004);transform:rotate(-9deg)}
.tm-color-row{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}.tm-color{display:flex;align-items:center;gap:4px;padding:4px 7px;border:1px solid #111;border-radius:999px;background:#fff;font-size:8px;font-weight:900}.tm-color i{width:9px;height:9px;border-radius:50%;border:1px solid #111}.tm-color .pink{background:#ff4fa1}.tm-color .chart{background:#c7ef2d}.tm-color .meal{background:#c99a57}.tm-color .white{background:#fff}
.chip.on{background:#111!important;color:#fff!important;border-color:#e51b23!important;box-shadow:0 0 0 2px #e51b23!important}.card{border-color:#d7d9db!important}.scene{border:2px solid #111!important}.scene small{color:#c3151b!important}.level strong{color:#c3151b!important}.meter{border:5px solid #e51b23!important;background:linear-gradient(145deg,#d8ef38,#fff568)!important;color:#111!important;box-shadow:0 8px 0 #111,0 15px 24px #0004!important}.range{accent-color:#e51b23!important}.now{background:#111!important;color:#fff!important;border:2px solid #d8ef38!important}.stat{border-top:4px solid #e51b23!important}.stat:nth-child(2){border-top-color:#d8ef38!important}.stat:nth-child(3){border-top-color:#111!important}.stat:nth-child(4){border-top-color:#89a91e!important}.action{border-left:5px solid #e51b23!important}.action .ico{background:#f9e3e4!important}
.tm-gear-card{display:flex;align-items:center;gap:11px;margin-top:10px;padding:13px;border:3px solid #111;border-radius:20px;background:repeating-linear-gradient(135deg,#0c0d0f 0 10px,#15171b 10px 20px);color:#fff;box-shadow:0 8px 0 #e51b23}.tm-gear-card svg{width:85px;flex:0 0 auto}.tm-gear-card small{display:block;color:#d8ef38;font-size:8px;font-weight:1000;letter-spacing:.12em}.tm-gear-card strong{display:block;margin:3px 0;font-size:15px}.tm-gear-card p{margin:0;color:#e5e7e9;font-size:9px}.tm-gear-card b{color:#ff5660}
.report{border:2px solid #111!important;border-left:6px solid #e51b23!important}.feeditem{border-left:5px solid #d8ef38!important}.feeditem b{color:#c3151b!important}
.tm-section-ribbon{display:flex;align-items:center;gap:10px;margin:9px 0 12px;padding:10px 12px;border-radius:16px;background:#111;color:#fff;border-bottom:4px solid #e51b23}.tm-section-ribbon svg{width:44px;height:34px;flex:0 0 auto}.tm-section-ribbon small{display:block;color:#d8ef38;font-size:8px;font-weight:1000;letter-spacing:.13em}.tm-section-ribbon strong{display:block;font-size:14px}.tm-section-ribbon p{margin:2px 0 0;color:#dfe3e5;font-size:9px}
.start,.catch,.guidebtn{background:linear-gradient(145deg,#ef242b,#b8080e)!important;border:3px solid #111!important;box-shadow:0 8px 0 #111,0 15px 25px #e51b2344!important;text-transform:uppercase}.session{border-top:6px solid #e51b23!important}.setup button.on{background:#111!important;color:#fff!important;border-color:#e51b23!important;box-shadow:0 0 0 2px #e51b23!important}.end{border:2px solid #111!important;color:#b8080e!important}.guidehero{background:repeating-linear-gradient(135deg,#090a0c 0 11px,#15171b 11px 22px)!important;border:4px solid #e51b23!important;box-shadow:0 10px 0 #d8ef38!important}.guidehero:before{content:"OFFICIAL TROUT MAGNET GUIDE SERVICE";display:block;margin-bottom:9px;color:#d8ef38;font-size:9px;font-weight:1000;letter-spacing:.13em}.trip.on{border-color:#e51b23!important;box-shadow:0 7px 0 #111!important}.profile{background:repeating-linear-gradient(135deg,#090a0c 0 10px,#15171b 10px 20px)!important;border:4px solid #e51b23!important;box-shadow:0 9px 0 #d8ef38!important}.avatar{background:#d8ef38!important;color:#111!important;border-color:#fff!important}.xp i{background:linear-gradient(90deg,#e51b23,#d8ef38)!important}.badge{border-top:4px solid #e51b23!important}
.bottom{border-top:4px solid #111!important;box-shadow:0 -8px 24px #0002!important}.nav.on{color:#c3151b!important}.nav:nth-child(3) span{display:grid!important;place-items:center;margin:-22px auto 1px;width:49px;height:49px!important;border:4px solid #fff;border-radius:50%;background:#e51b23;color:#fff;box-shadow:0 6px 0 #111}.nav:nth-child(3){padding-top:18px}.toast{background:#111!important;border:2px solid #d8ef38!important}
@media(max-width:360px){.tm-fishmark{width:50px}.tm-name{font-size:21px}.tm-brand-hero{padding-right:110px}.tm-jig{width:112px}.demo{display:none}}
`;

  const FISH_MARK = `<svg class="tm-fishmark" viewBox="0 0 184 116" aria-hidden="true"><path d="M15 67C40 27 88 14 135 34c16 7 29 18 38 30-11 12-25 24-43 31C83 113 39 97 15 67Z" fill="#b8d431" stroke="#fff" stroke-width="5"/><path d="M15 67 1 38c19 4 32 13 41 27-10 16-23 27-41 31Z" fill="#189645" stroke="#fff" stroke-width="5"/><path d="M84 35 100 8c13 7 23 17 29 30Z" fill="#d9ed3a" stroke="#fff" stroke-width="5"/><circle cx="143" cy="50" r="6" fill="#111"/><path d="M145 69c8 4 15 4 23-1" fill="none" stroke="#111" stroke-width="4" stroke-linecap="round"/></svg>`;
  const JIG = `<svg class="tm-jig" viewBox="0 0 180 145" aria-hidden="true"><path d="M58 38c23 5 48 13 68 25" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/><path d="M126 63c27 22 31 49 11 66-12 10-31 3-35-11" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/><circle cx="55" cy="36" r="17" fill="#d0d2d3" stroke="#111" stroke-width="5"/><circle cx="50" cy="31" r="4" fill="#111"/><path d="M69 43c15 4 30 8 45 17" fill="none" stroke="#ff4fa1" stroke-width="20" stroke-linecap="round"/><path d="M82 49l-5 12M94 53l-5 13M106 58l-5 13" stroke="#a4004e" stroke-width="3"/><path d="M114 60c15 8 26 19 34 34M111 63c8 13 12 27 13 41" fill="none" stroke="#ff4fa1" stroke-width="9" stroke-linecap="round"/></svg>`;
  const MINI_JIG = `<svg viewBox="0 0 110 66" aria-hidden="true"><circle cx="24" cy="21" r="12" fill="#d7d9da" stroke="#fff" stroke-width="3"/><path d="M35 25c17 3 32 8 45 17" fill="none" stroke="#ff4fa1" stroke-width="14" stroke-linecap="round"/><path d="M80 42c17 9 23 15 27 22M80 43c8 12 11 17 11 22" fill="none" stroke="#ff4fa1" stroke-width="6" stroke-linecap="round"/><path d="M25 9c31 3 57 13 74 31 11 12 8 23-3 26" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>`;

  const HEADER = `<header class="top tm-top"><div class="tm-lockup">${FISH_MARK}<div class="tm-words"><div class="tm-name"><span class="trout">Trout</span><span class="magnet">Magnet</span></div><div class="tm-appname">RIVERCAST</div></div></div><button class="demo" id="demo">V0.4 BRANDED</button></header>`;
  const HERO = `<div class="tm-brand-hero"><small>THE TROUT MAGNET RIVER COMPANION</small><strong>Plan the water.<br>Fish the window.</strong><p>River timing, live reports, catch logging and proven Trout Magnet setups.</p><div class="tm-color-row"><span class="tm-color"><i class="pink"></i>Pink</span><span class="tm-color"><i class="chart"></i>Chartreuse</span><span class="tm-color"><i class="meal"></i>Mealworm</span><span class="tm-color"><i class="white"></i>White</span></div>${JIG}</div>`;
  const GEAR = `<div class="tm-gear-card">${MINI_JIG}<div><small>TROUT MAGNET SETUP</small><strong><b>Pink body</b> · 1/64 oz head</strong><p>Suggested for the current simulated water, light and temperature pattern.</p></div></div>`;
  const FISH_RIBBON = `<div class="tm-section-ribbon">${MINI_JIG}<div><small>TROUT MAGNET FISHING LOG</small><strong>Every catch improves your pattern.</strong><p>Track color, depth, water and time—not just the total.</p></div></div>`;
  const GUIDE_RIBBON = `<div class="tm-section-ribbon">${FISH_MARK}<div><small>SORE LIP 'EM ALL</small><strong>Official Trout Magnet guided fishing.</strong><p>Learn the system on the Little Red River.</p></div></div>`;
  const PROFILE_RIBBON = `<div class="tm-section-ribbon">${FISH_MARK}<div><small>TROUT MAGNET ANGLER PROFILE</small><strong>Level up by fishing and helping the river community.</strong></div></div>`;

  try{
    const response = await fetch('../rivercast-v0.3/mobile.html?brand=v04', {cache:'no-store'});
    if(!response.ok) throw new Error('Preview source returned '+response.status);
    let html = await response.text();
    html = html.replace('<meta name="theme-color" content="#07324a">','<meta name="theme-color" content="#111111">');
    html = html.replace('<title>Trout Magnet RiverCast</title>','<title>Trout Magnet RiverCast | Little Red River</title>');
    html = html.replace('</style>', BRAND_CSS + '</style>');
    html = html.replace('<header class="top"><div class="brand">TROUT MAGNET<b>RIVERCAST</b></div><button class="demo" id="demo">V0.3.1 DEMO</button></header>', HEADER);
    html = html.replace('<section class="screen active" data-screen="river"><p class="eyebrow">LITTLE RED RIVER</p><h1>Know when the water gets there.</h1>', '<section class="screen active" data-screen="river"><p class="eyebrow">LITTLE RED RIVER</p><h1>Know when the water gets there.</h1>'+HERO);
    const gridEnd = '</div></div><div class="action"><div class="ico">💧</div>';
    html = html.replace(gridEnd, '</div></div>'+GEAR+'<div class="action"><div class="ico">💧</div>');
    html = html.replace('<section class="screen" data-screen="fish"><p class="eyebrow">SESSION</p><h1>Fish Now</h1>', '<section class="screen" data-screen="fish"><p class="eyebrow">SESSION</p><h1>Fish Now</h1>'+FISH_RIBBON);
    html = html.replace('<section class="screen" data-screen="guides">', '<section class="screen" data-screen="guides">'+GUIDE_RIBBON);
    html = html.replace('<section class="screen" data-screen="profile">', '<section class="screen" data-screen="profile">'+PROFILE_RIBBON);
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    console.error(error);
    document.getElementById('fallback').style.display='block';
    document.querySelector('.loader-copy').textContent='The branded preview could not finish loading.';
  }
})();
</script>
</body>
</html>
